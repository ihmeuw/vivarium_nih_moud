components:
    vivarium_public_health:
        population:
            - BasePopulation()
            - Mortality()
        disease:
            - SIS('oud_consistent')
        results:
            - ResultsStratifier()
            - DisabilityObserver()
            - DiseaseObserver('oud_consistent')
            - MortalityObserver()

configuration:
    input_data:
        input_draw_number: 0
        artifact_path:  /home/abie/vivarium_nih_moud/washington.hdf # /mnt/team/simulation_science/pub/training/abie/artifacts/washington.hdf

    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 4344
        additional_seed: 169
    time:
        start:
            year: 2019
            month: 1
            day: 1
        end:
            year: 2040
            month: 1
            day: 1
        step_size: 7 # Days
    population:
        population_size: 100_000
        initialization_age_min: 0
        initialization_age_max: 100
        untracking_age: 100

    stratification:
        default:
            - 'age_group'
            - 'sex'
            - 'current_year'
        # disability:
        #     include:
        #     exclude:
        # mortality:
        #     include:
        #     exclude:
