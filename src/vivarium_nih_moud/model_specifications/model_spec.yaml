components:
    vivarium_public_health:
        population:
            - BasePopulation()
            - Mortality()
        results:
            - ResultsStratifier()
            - DisabilityObserver()
            # - DiseaseObserver('oud_consistent')
            # - MortalityObserver()
    vivarium_nih_moud.components:
        - conditions.moud_model()

configuration:
    input_data:
        input_draw_number: 0
        artifact_path:  /home/abie/vivarium_nih_moud/washington.hdf # /mnt/team/simulation_science/pub/training/abie/artifacts/washington.hdf

    interpolation:
        order: 0
        extrapolate: True
    randomness:
        map_size: 1_000_000
        key_columns: ['entrance_time', 'age']
        random_seed: 4344
        additional_seed: 169
    time:
        start:
            year: 2019
            month: 1
            day: 1
        end:
            year: 2040
            month: 1
            day: 1
        step_size: 7 # Days
    population:
        population_size: 100_000
        initialization_age_min: 0
        initialization_age_max: 100
        untracking_age: 100
    oud_consistent:
        exposure: 0.016, # HACK: this should not be used, nor necessary
        state_to_risk_category_map:
            with_condition: cat1
            susceptible_to_opioid_use_disorders: cat2
            on_treatment: cat2
    risk_factor:
        oud_consistent:
            category_thresholds: []
            rebinned_exposed: []


    stratification:
        default:
            - 'age_group'
            - 'sex'
            - 'current_year'
        # disability:
        #     include:
        #     exclude:
        # mortality:
        #     include:
        #     exclude:
